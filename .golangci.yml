# golangci-lint v2, pinned in tools/go.mod.
# Run: make lint-go  (go tool -modfile=tools/go.mod golangci-lint run)
version: "2"

run:
  # A run with no analysis cache (evicted, or a new linter) takes 6-8 minutes on the CI runner; the job's own limit is 20.
  timeout: 15m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unparam
  settings:
    depguard:
      rules:
        # SYS-1: external processes only through core/exec (allowlisted binary + argv, no shell).
        sys1-exec:
          files:
            - "$all"
            - "!**/core/exec/**"
          deny:
            - pkg: os/exec
              desc: "SYS-1: run external processes only through core/exec"
        # FORBID-2 of modules/core/CONTRACT.md: core never imports a module.
        core-no-modules:
          files:
            - "**/core/**"
            - "!**/modules/**" # modules/core is the core *module* and may import itself
          deny:
            - pkg: github.com/knt048/vedette/modules
              desc: "core must not import modules (dependency direction is module -> core)"
    forbidigo:
      analyze-types: true
      forbid:
        # The news fetcher's network seam is for tests only (the rule is switched off for _test.go below).
        - pattern: ^\(\*github\.com/knt048/vedette/modules/ai\.Service\)\.SetNewsNetwork$
          msg: "SetNewsNetwork is a test seam: call it from a _test.go file only"
        - pattern: ^http\.DefaultClient$
          msg: "use an http.Client with timeouts"
        - pattern: ^http\.(Get|Head|Post|PostForm)$
          msg: "use an http.Client with timeouts and a context"
        - pattern: ^time\.Sleep$
          msg: "wait on a timer with a context; in tests use testing/synctest"
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      no-global: all # pass a logger; no slog.Info(...) on the global logger
      static-msg: true
      key-naming-case: snake
      context: scope

  exclusions:
    rules:
      - path: _test\.go
        linters: [forbidigo]
        text: "SetNewsNetwork"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/knt048/vedette
