id: ai                 # trùng tên thư mục
name: { vi: "Trợ lý AI (BYOK)", en: "AI assistant (BYOK)" }
summary: { vi: "Hồ sơ AI của khách, phân việc có dự phòng, harness (rule, memory, skill, RAG, kết nối ngoài, hook), nhật ký AI chống sửa; AI không có công cụ ghi.", en: "Customer AI profiles, job assignments with fallback, harness (rules, memory, skills, RAG, connections, hooks) and a tamper-evident AI log; the AI has no write tool." }
tier: optional
default: off
depends: [core]
soft_depends: [feeds, inventory, logs, scan, notify, honeypot]   # module nào có dữ liệu thì AI đọc được; thiếu thì skill nói rõ thiếu
permissions: ["outbound:https"]        # tới provider khách cấu hình; fetch advisory/PoC/RSS cho "CVE news" do hộp làm, không phải AI
ports: []
container: core        # D-55
tables_prefix: ai_
tables: [ai_profile, ai_assignment, ai_setting, ai_result, ai_downgrade, ai_rule, ai_memory, ai_memory_suggestion, ai_skill_state, ai_knowledge_doc, ai_knowledge_chunk, ai_knowledge_chunk_fts, ai_hook, ai_hook_state, ai_activity]   # kết nối ngoài: core_connection* (D-93), không phải bảng của ai
stories: [S-AI-1, S-AI-2, S-AI-3, S-AI-4, S-AI-5, S-AI-6, S-AI-7, S-AI-8]
milestone: M6
