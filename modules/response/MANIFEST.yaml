id: response           # same as the folder name
name: { en: "Response" }
summary: { en: "WHEN-IF-THEN rules and AI proposals that lead to actions on the customer's firewall, switch or DNS; approval by default; a block list the firewall pulls." }
tier: optional
default: off           # the switch that executes actions on devices is a separate switch, also OFF by default
risk: high             # a dangerous function: the customer takes responsibility
depends: [core, notify, inventory]   # notify: the approval and notification channel; inventory: devices, context. The connection to devices belongs to core (core/conn), so actions on devices run even when ai is off; `ai` is in soft_depends
soft_depends: [ai, findings, honeypot, logs, exposure, scan, sensor-passive]   # ai: proposals (the Propose gate) + the plan; the rest are trigger sources; when one is missing its trigger has no events
permissions: ["outbound:lan"]          # SSH/HTTP API to devices in the scope the customer declares (SYS-7); no root, no docker
ports: []              # the public routes sit on core's port 8443: /response/approve/{token}, /response/blocklist/{token}.txt
container: core
tables_prefix: resp_
tables: [resp_settings, resp_plans, resp_actions, resp_catalog, resp_rules, resp_allowlist, resp_blocklist, resp_tokens, resp_done, resp_ai_notes, resp_hints, resp_log]   # mock dùng response_* (+ resp_log)
stories: [S-RESP-1, S-RESP-2, S-RESP-3, S-RESP-4, S-AI-8]
milestone: M1 (GUI)
