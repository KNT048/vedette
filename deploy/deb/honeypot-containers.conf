# containers.conf module of the vedette-honeypot unit only (ContainersConfModule= in host/ops/quadlet.go, #486).
# The container joins the namespace vedette-hp, which vedette-host owns, from its own user namespace (UserNS=auto).
# From there crun may not write a sysctl of that namespace, so a distribution default (Ubuntu 26.04:
# net.ipv4.ping_group_range) stops the start. The honeypot needs none; vedette-host sets the namespace's sysctls.
# {append=false} (podman >= 4.8): replace the list even when an earlier drop-in set {append=true}; a plain [] would not.
[containers]
default_sysctls = [{append=false}]
