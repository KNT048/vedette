# Vedette's rule list for ZAP's baseline scan (D-565, exposure INV-24). Format of zap-baseline.py -c (the file -g generates):
# <rule id> TAB <IGNORE|WARN|FAIL> TAB (<name>); a line that starts with # is a comment. ZAP reads only the id and the status, and
# refuses a rule line with fewer than two tabs, so the name column is required. Rule ids and names: https://www.zaproxy.org/docs/alerts/
# exposure reads this same file (content/zap): IGNORE alerts are dropped, FAIL alerts are shown first as "Fix this", WARN alerts and
# rules not listed here are shown under "Hardening". Checked by content/zap TestBaseline_IsZAPConfig.
#
# IGNORE: noise for a small business owner, or too often a false positive without context.
#
# Unix-time-looking numbers in pages: almost always ids or cache keys, never actionable.
10096	IGNORE	(Timestamp Disclosure)
# Words like "TODO" or "admin" in comments: mostly framework code the owner did not write and cannot act on.
10027	IGNORE	(Information Disclosure - Suspicious Comments)
# Informational: says the site uses JavaScript, nothing to fix.
10109	IGNORE	(Modern Web Application)
# Informational: describes caching, not a problem.
10049	IGNORE	(Content Cacheability)
# Asks a human to review cache headers; no finding by itself.
10015	IGNORE	(Re-examine Cache-control Directives)
# Informational: ZAP found a login request, nothing to fix.
10111	IGNORE	(Authentication Request Identified)
# Informational: ZAP found a session token, nothing to fix.
10112	IGNORE	(Session Management Response Identified)
# Flags every use of eval-like functions in any script, including libraries: a false positive without code review.
10110	IGNORE	(Dangerous JS Functions)
# Spectre site-isolation headers: a browser-hardening detail that small sites never need.
90004	IGNORE	(Insufficient Site Isolation Against Spectre Vulnerability)
# Permissions-Policy header: a fine-tuning header, missing on almost every site.
10063	IGNORE	(Permissions Policy Header Not Set)
#
# WARN, shown as "Hardening": worth doing, but not a hole by itself.
#
# Without X-Frame-Options or CSP frame-ancestors another site can frame the page (clickjacking).
10020	WARN	(Anti-clickjacking Header)
# Without nosniff an old browser may run an upload as script.
10021	WARN	(X-Content-Type-Options Header Missing)
# Without HSTS a first visit over http can be intercepted.
10035	WARN	(Strict-Transport-Security Header)
# No Content-Security-Policy: an injected script runs with nothing to stop it.
10038	WARN	(Content Security Policy (CSP) Header Not Set)
# A Content-Security-Policy that allows too much.
10055	WARN	(CSP)
# A cookie JavaScript can read: a script injection can steal the session.
10010	WARN	(Cookie No HttpOnly Flag)
# A cookie sent over plain http as well.
10011	WARN	(Cookie Without Secure Flag)
# A cookie other sites' requests carry (cross-site request forgery).
10054	WARN	(Cookie without SameSite Attribute)
# CORS that lets any site read the answers.
10098	WARN	(Cross-Domain Misconfiguration)
# Often a false positive (forms without a token on purpose): hardening, never shown as a vulnerability.
10202	WARN	(Absence of Anti-CSRF Tokens)
# An internal address in a page: tells an attacker about the LAN, nothing more.
2	WARN	(Private IP Disclosure)
#
# FAIL, shown first as "Fix this": something the owner should change.
#
# A JavaScript library with known vulnerabilities (Retire.js names its CVEs; an exploited one is listed with the exploited CVEs).
10003	FAIL	(Vulnerable JS Library)
# The Server header names the product and version: an attacker's lookup key, and Vedette compares it with the exploited CVEs.
10036	FAIL	(Server Leaks Version Information via "Server" HTTP Response Header Field)
# The X-Powered-By header names the framework and version (PHP/7.4.3): same as above.
10037	FAIL	(Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s))
# An error page that shows stack traces or internals.
90022	FAIL	(Application Error Disclosure)
# Debug error messages left on in production.
10023	FAIL	(Information Disclosure - Debug Error Messages)
# Personal data (card numbers and the like) in a page.
10062	FAIL	(PII Disclosure)
# An https page that loads parts over http: they can be swapped in transit.
10040	FAIL	(Secure Pages Include Mixed Content)
# A password sent with Basic or Digest authentication over plain http.
10105	FAIL	(Weak Authentication Method)
