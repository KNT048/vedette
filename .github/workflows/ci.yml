# CI: every job calls make targets only (docs/ENGINEERING.md §7); all jobs must pass to merge.
# Third-party actions are pinned by commit SHA; GITHUB_TOKEN is read-only.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *" # daily govulncheck on main (SECURITY.md: daily scans)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - name: Typecheck, lint, unit, contract drift, build
        run: make verify-web
      - name: Install Chromium for e2e
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: E2E on the production build (vite preview)
        run: make e2e
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build, vet, test -race, contract, golangci-lint, govulncheck
        if: github.event_name != 'schedule'
        run: make verify-go
      - name: Daily vulnerability scan
        if: github.event_name == 'schedule'
        run: make vuln
