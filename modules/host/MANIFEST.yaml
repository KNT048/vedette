id: host               # trùng tên thư mục; tên tiến trình: vedette-host
kind: component        # KHÔNG phải module bật/tắt trong Cài đặt: là tiến trình systemd của hộp appliance (D-53, D-55). Có hợp đồng như module.
name: { vi: "Trình quản lý máy chủ (vedette-host)", en: "Box host helper (vedette-host)" }
summary: { vi: "Tiến trình root rất nhỏ, chỉ chạy một danh sách lệnh cố định: cập nhật OS, cấu hình mạng/SPAN/IP phụ, kéo và hoàn tác image đã ký, sao lưu.", en: "A very small root process that runs only a fixed command list: OS updates, network/SPAN/secondary-IP setup, signed image pull and rollback, backup." }
tier: core             # luôn có ở kiểu cài Appliance; KHÔNG có ở kiểu "Chỉ container" (D-55)
default: on            # kiểu Appliance
install_types: [appliance]   # "Chỉ container": không có host; tính năng quản lý OS/mạng báo "không hỗ trợ"
depends: []            # là phần của appliance, độc lập với module Go
permissions: [root, "systemd", "apt", "podman", "netlink"]   # chỉ trong tiến trình này; mọi thứ khác chạy không root (agent-safety, SYS-1)
ports: []              # không cổng mạng: nghe socket Unix nội bộ
socket: /run/vedette/host.sock   # mặc định; installer ghi đường dẫn thật vào /etc/vedette/host.conf (docs/specs/host-api.md §15)
container: none        # chạy trên OS (systemd, root), KHÔNG trong container
tables_prefix: null    # không sở hữu bảng; lịch sử chạy lưu ở core (core_os_run, core_audit)
stories: [S-CORE-7, S-INV-5]   # + cấu hình mạng/SPAN D-56 (chưa có story ID, xem câu hỏi mở 1)
milestone: M2
