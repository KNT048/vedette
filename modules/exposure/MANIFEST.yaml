id: exposure
name: { en: "External exposure" }
summary: { en: "Proves you own a domain or the box's public IP, then lists subdomains, IPs, open ports, exposed admin pages and expiring certificates, with a snapshot per day." }
tier: optional
default: false
depends: [core, inventory]
permissions: [outbound:https]   # subdomain discovery (CT, crt.sh), the runs of `scan`, three public "my IP" services (AWS, Cloudflare, Google Cloud) so the box sees its own public IP, and Shodan InternetDB when the admin clicks; Greenbone is an optional separate container that talks over the gvmd socket; no project-run server
ports: []
container: [core]               # API and data live in `core`; the external-surface scanner of `scan` (pure Go, TCP connections) also runs inside `core`
tables_prefix: exp_
stories: [S-EXP-1, S-EXP-2]
milestone: M4
