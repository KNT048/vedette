id: sensor-passive
name: { en: "Passive discovery" }
summary: { en: "Listens on the network (DHCP, mDNS, SSDP, ARP, LLDP and optional SPAN/TAP metadata) and feeds what it sees to the inventory without sending a packet." }
tier: standard
default: true
depends: [core, inventory]
permissions: [net_raw, pcap]    # CAP_NET_RAW only (ambient), User=<sensor_uid>, no UserNS; the SPAN card has no IP
ports: []                       # packet capture only, no listening port
container: sensor               # the capture half in `sensor` (host network, the passive mTLS role); the core half (sp_*) in `core`
tables_prefix: sp_              # note: MODULES.md says `inv_*`; see the open question
stories: [S-INV-1, S-INV-3, S-LOG-4]
milestone: M3
