id: honeypot           # same as the folder name
name: { en: "Honeypot" }
summary: { en: "Trap IPs that look like real devices (name, vendor MAC, their own services: SMB, RDP, SSH, databases, web, FTP, Telnet, VNC... 18 in all) and honey tokens: any touch is an alert, touching two Trap IPs within a minute is a scan." }
tier: optional
needs_host: true      # runs only where vedette-host is (the appliance); a container-only install cannot turn it on
default: off
depends: [core, inventory]
soft_depends: [notify, response]   # notify: sends alerts; response: the "honeypot" trigger (without response a hit is still stored and reported)
permissions: [net_bind_low, "host:net.decoy_ip"]   # low ports of the services in the honeypot container; the Trap IP addresses and the port list of each address are set up by vedette-host
ports: ["tcp/445", "tcp/3389", "tcp/22", "tcp/1433", "tcp/80", "tcp/443", "tcp/21", "tcp/23", "tcp/3306", "tcp/27017", "tcp/6379", "tcp/5900", "tcp/9418", "tcp/8080", "tcp/25", "udp/69", "udp/123", "udp/5060"]   # only on Trap IPs, each Trap IP only the ports of the service it has; not on the box's admin IP
container: honeypot    # OpenCanary (BSD-3) in its own container, macvlan on a secondary IP; the API + tables live in `core`
tables_prefix: hp_
tables: [hp_config, hp_trap_ips, hp_hits, hp_tokens, hp_ignored_day]
stories: [S-HP-1, S-HP-2]
milestone: M5
