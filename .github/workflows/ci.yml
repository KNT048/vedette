# CI on GitHub's runners (D-63): free for this public repo, and it keeps the heavy full
# suites (vitest, govulncheck) off the developers' machines. Every job calls make only,
# except the two aggregators `go` and `web`, which only compare job results (D-140).
# No Playwright e2e here (D-64): the full e2e suite runs only when the product is production-ready.
# Local gate before pushing stays `make check` (D-62). Third-party actions pinned by commit SHA.
#
# Shape (D-140, D-365): `changes` decides what a run needs (scripts/ci, no third-party action);
# go-static, go-lint, go-test (4 shards, weighted by scripts/ci/testtime.tsv) and go-release run in parallel; web-verify runs the web
# suite. go-static and go-lint each keep a rolling Go cache that only main saves (D-372).
# go-test runs -race on a push to main and the daily run only (D-371, D-376): pull requests and the merge queue run without it,
# and skip the slow and quarantined tests of scripts/ci/skip-tests.txt, which only the daily run runs.
# A push to main runs the Go jobs, mostly from the cache, to save main's Go caches (the merge queue already ran every job on that
# tree; a merge_group ref cannot save a cache others can read), not web-verify; the daily schedule runs everything twice, uncached and shuffled (-count=2 -shuffle=on), and its failed tests go to
# the issue labelled flaky.
# `go` and `web` always run and always report under those names (the ruleset on main requires them,
# and the merge queue runs this workflow on its merge_group ref, D-245): they succeed only when every job they need succeeded or was
# skipped because `changes` said it was not needed. A failed or cancelled job fails the aggregator.
name: ci

on:
  pull_request:
  # The merge queue (D-245) tests each queued PR merged onto main and the PRs ahead of it; `changes` runs
  # everything for this event (scripts/ci Decide), so what lands on main passed the full suite as merged.
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *" # daily audit on main (SECURITY.md)
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the older run; runs on main are never cancelled once they run, but a waiting push run
# is replaced by a newer one (GitHub keeps one pending run per group): the newest main tree saves the cache. The group holds the
# event, so the daily schedule never waits behind, or is replaced by, a push (D-365).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
      tests: ${{ steps.c.outputs.tests }}
      web: ${{ steps.c.outputs.web }}
      vuln: ${{ steps.c.outputs.vuln }}
      audit: ${{ steps.c.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }} # a PR merge commit: HEAD^1 is the base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # scripts/ci uses the standard library only
      - id: c
        run: make ci-changes

  go-static:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.vuln == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the Go cache below holds the build cache, the vet results and the go tool binaries (sqlc, ogen)
      # D-372: the same rolling cache as go-test (D-365), its own key: every run restores the newest one main saved, only main saves.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-static-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-static-${{ runner.os }}-
      - name: Build, vet, generated code, shard coverage, notices
        if: needs.changes.outputs.go == 'true'
        run: make verify-go-static
      - name: govulncheck (Go changes and the daily schedule)
        if: needs.changes.outputs.vuln == 'true'
        run: make vuln
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-static-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  # D-372: golangci-lint on its own runner, in parallel with go-static, with its own cache (only main saves): the Go build cache
  # (golangci-lint's own binary, built by go tool, and the type-checked packages), the modules of tools/go.mod, and its analysis
  # cache. The key holds tools/go.sum and .golangci.yml, so a new linter or config starts from a fresh analysis cache.
  go-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the cache below
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-lint-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}-
      - name: golangci-lint
        run: make lint-go
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

  go-test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 50 || 20 }} # the daily run tests everything twice
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4] # SHARDS in the Makefile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the Go cache below holds the build and test caches of this shard
      # D-365: go test reuses the result of a package whose test binary and inputs did not change. Every run restores the newest
      # cache of its shard that main saved (a pull request and a merge_group ref may restore main's caches, never each other's);
      # only main saves, so the repository's 10 GB is not filled with per-PR copies that would evict main's.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-test-${{ runner.os }}-${{ matrix.shard }}-
      - name: go test (-race on main and daily), shard ${{ matrix.shard }} of 4
        env:
          # D-371, D-376: a pull request and the merge queue test without the race detector (4-8x faster: modules/ai 17 s vs 180 s);
          # a push to main and the daily run keep -race, so a race is still caught within a day of its merge.
          RACE: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '-race' || '' }}
          # D-376: the tests of scripts/ci/skip-tests.txt (slow, quarantined flaky) run only in the daily schedule.
          SKIPTESTS: ${{ github.event_name != 'schedule' && '1' || '' }}
          # The daily run tests everything twice, uncached, in a shuffled order, to find flaky tests (the flaky job lists them).
          # -shuffle stays off elsewhere: it is not a cacheable flag, so it would turn the test cache off (go help test).
          GOTESTFLAGS: ${{ github.event_name == 'schedule' && '-count=2 -shuffle=on -timeout=40m' || '' }}
        run: make test-go-shard SHARD=${{ matrix.shard }} RACE="$RACE" SKIPTESTS="$SKIPTESTS"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

  # D-365: a failed daily run adds its failed tests to the one open issue labelled flaky. Only this job may write issues.
  flaky:
    needs: [changes, go-test]
    if: always() && github.event_name == 'schedule' && needs.go-test.result != 'success' && needs.go-test.result != 'skipped' # a timed-out shard ends cancelled
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # scripts/ci uses the standard library only
      - name: Open or update the flaky issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: make ci-flaky

  go-release:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Release vectors (-tags releasetestkeys)
        run: make test-go-release

  go:
    needs: [changes, go-static, go-lint, go-test, go-release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded, every unneeded one was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          STATIC_WANTED: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.vuln == 'true' }}
          STATIC: ${{ needs.go-static.result }}
          LINT_WANTED: ${{ needs.changes.outputs.go == 'true' }}
          LINT: ${{ needs.go-lint.result }}
          TESTS_WANTED: ${{ needs.changes.outputs.tests == 'true' }}
          RELEASE_WANTED: ${{ needs.changes.outputs.go == 'true' }}
          TESTS: ${{ needs.go-test.result }}
          RELEASE: ${{ needs.go-release.result }}
        run: |
          set -eu
          [ "$CHANGES" = success ] || { echo "changes: $CHANGES"; exit 1; }
          check() { # name wanted result
            if [ "$2" = true ]; then [ "$3" = success ] || { echo "$1: $3, expected success"; exit 1; }
            else [ "$3" = skipped ] || { echo "$1: $3, expected skipped"; exit 1; }; fi
          }
          check go-static "$STATIC_WANTED" "$STATIC"
          check go-lint "$LINT_WANTED" "$LINT"
          check go-test "$TESTS_WANTED" "$TESTS"
          check go-release "$RELEASE_WANTED" "$RELEASE"

  web-verify:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - name: Typecheck, lint, unit, contract drift, build
        if: needs.changes.outputs.web == 'true'
        run: make verify-web
      - name: Daily vulnerability scan (web)
        if: needs.changes.outputs.audit == 'true'
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web audit --prod

  web:
    needs: [changes, web-verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The web job succeeded when needed and was skipped when not
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.audit == 'true' }}
          VERIFY: ${{ needs.web-verify.result }}
        run: |
          set -eu
          [ "$CHANGES" = success ] || { echo "changes: $CHANGES"; exit 1; }
          if [ "$WANTED" = true ]; then [ "$VERIFY" = success ] || { echo "web-verify: $VERIFY, expected success"; exit 1; }
          else [ "$VERIFY" = skipped ] || { echo "web-verify: $VERIFY, expected skipped"; exit 1; }; fi
