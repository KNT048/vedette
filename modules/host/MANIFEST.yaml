id: host               # same as the folder name; process name: vedette-host
kind: component        # NOT a module that is switched on/off in Settings: it is the systemd process of the appliance box. It has a contract like a module.
name: { en: "Box host helper (vedette-host)" }
summary: { en: "A very small root process that runs only a fixed command list: OS updates, network/SPAN/secondary-IP setup, signed image pull and rollback, backup." }
tier: core             # always present on the Appliance install type; NOT present on the "Container only" type
default: on            # Appliance type
install_types: [appliance]   # "Container only": there is no host; the OS/network management features say "not supported"
depends: []            # part of the appliance, independent of the Go modules
permissions: [root, "systemd", "apt", "podman", "netlink"]   # only in this process; everything else runs without root (SYS-1)
ports: []              # no network port: listens on an internal Unix socket
socket: /run/vedette/host.sock   # default; the installer writes the real path into /etc/vedette/host.conf (docs/specs/host-api.md §15)
container: none        # runs on the OS (systemd, root), NOT in a container
tables_prefix: null    # owns no tables; the run history is kept in core (core_os_run, core_audit)
stories: [S-CORE-7, S-INV-5]   # + network/SPAN configuration (no story ID yet, see open question 1)
milestone: M2
