# The honeypot's Samba (WP-08e, D-162): a read-only guest share of planted file tokens whose every open is audited. Samba runs as the
# unprivileged user of the container (init.py), from a read-only root: every path Samba writes is under /tmp (a tmpfs), nothing is
# published on NetBIOS, there is no printer, no user database and no write access to the share.
[global]
	server role = standalone server
	workgroup = WORKGROUP
	netbios name = FILESERVER
	server string = File Server
	disable netbios = yes
	smb ports = 445
	server min protocol = SMB2_02

	# every client is a guest; there is no account to guess and nothing to authenticate against
	map to guest = Bad User
	guest account = hp
	restrict anonymous = 0
	passdb backend = tdbsam:/tmp/samba/private/passdb.tdb

	load printers = no
	disable spoolss = yes
	printcap name = /dev/null
	dns proxy = no
	usershare max shares = 0
	follow symlinks = no
	wide links = no

	log level = 1
	# smbd prints to stdout (--debug-stdout); the log file name is only where Samba derives its core-dump folder from: without it, that is
	# /var/log/samba/cores on the read-only root ("Failed to create /var/log/samba/cores"), now /tmp/samba/cores. Bounded, never read.
	log file = /tmp/samba/log.smbd
	max log size = 1024
	lock directory = /tmp/samba/lock
	state directory = /tmp/samba/state
	cache directory = /tmp/samba/cache
	pid directory = /tmp/samba/pid
	private dir = /tmp/samba/private
	ncalrpc dir = /tmp/samba/ncalrpc

	# The audit is not sent to syslog: smbd prints it on its standard output, which init.py reads through a pipe and turns into the line
	# OpenCanary's smb module parses. The prefix (a random token, then only values the server decides: client and server address, server
	# name, protocol, client OS class, share) is written by init.py at start into the included file, so nothing a client can make Samba
	# print elsewhere can pass for an audit line; init.py refuses any line that does not have exactly that shape and then op|status|path.
	vfs objects = full_audit
	full_audit:syslog = false
	full_audit:success = connect openat
	full_audit:failure = none
	include = /tmp/samba/audit.conf

[Shared]
	path = /tmp/share
	guest ok = yes
	read only = yes
	browseable = yes
