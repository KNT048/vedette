id: sensor-active
name: { en: "Active discovery" }
summary: { en: "Identifies devices and their services with nmap and SNMP, only inside the confirmed LAN scope, the time window and the speed limit you set." }
tier: standard
default: true
depends: [core, inventory]
permissions: [net_raw, "exec:nmap"]   # nmap từ kho gói OS, cài vào image `scan` do vedette-host dựng trên hộp (D-57 (2), D-113), không ship (D-4); -O cần raw socket
ports: []
container: scan                       # D-113: worker nmap trong `scan` (vai mTLS active); chính sách, phạm vi, sa_* ở `core`; tới SP-3 nmap còn chạy qua core/exec từ core (D-84 (5))
tables_prefix: sa_                    # D-84 (4): sa_; MODULES.md đã sửa
stories: [S-INV-1, S-SCAN-4]          # S-SCAN-4 phần cửa sổ giờ/tốc độ của khám phá
decisions: [D-4, D-26, D-32, D-45, D-55, D-57, D-84, D-109, D-110, D-111, D-113, D-114]
milestone: M3
