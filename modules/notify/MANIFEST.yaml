id: notify
name: { en: "Alert channels" }
summary: { en: "Sends alerts, vulnerability notices and approval requests to Telegram, Slack, Zalo, email and webhooks; keeps the Incidents list and the send history." }
tier: standard
default: true
depends: [core]
permissions: [outbound:https, outbound:smtp]   # Telegram/Slack/Zalo/webhook qua HTTPS; email qua SMTP của khách
ports: []        # Slack Socket Mode và Telegram long polling chỉ mở kết nối RA (D-38, D-46)
container: core
tables_prefix: notify_
stories: [S-NOT-1, S-NOT-2, S-ALERT-1, S-ALERT-3, S-RESP-2]   # MODULES.md ghi S-ALERT-1..2 (S-ALERT-2 đã rớt)
decisions: [D-35, D-38, D-46, D-52, D-447]
milestone: M2
