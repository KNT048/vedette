id: reports            # same as the folder name
name: { en: "Reports" }
summary: { en: "One-page weekly report (scheduled) and a personal-data-protection self-assessment under Law 91/2025/QH15 and Decree 356/2025/NĐ-CP, printable to PDF." }
tier: optional
default: off
depends: [core, inventory, feeds]
soft_depends: [notify, ai, scan, logs, honeypot]   # notify: sends the scheduled email (not yet listed in MODULES.md); ai: commentary; scan/logs/honeypot: sources of figures when present
permissions: []
ports: []
container: core        # the browser prints the PDF (CSS @media print), no server-side PDF library
tables_prefix: rep_
tables: [rep_schedule, rep_history, rep_weekly_ai, rep_pdpl]
stories: [S-REP-1, S-REP-2]
milestone: M7
