id: agent-intake       # same as the folder name
name: { en: "Agent intake" }
summary: { en: "Receives package lists from osquery (Vedette is the TLS server) or pulls them from the Wazuh API; ships no agent." }
tier: optional
default: off
depends: [core, inventory]
permissions: ["outbound:https"]       # pulls the Wazuh API at the address the customer declares
ports: ["tcp/8443"]                   # the same HTTPS port as core; osquery TLS + the install script page
container: core
tables_prefix: intake_
tables: [intake_agent_tokens, intake_osquery_nodes, intake_wazuh, intake_prune_clock]   # intake_wazuh: the Wazuh pull; intake_prune_clock: the clock of the node-prune job
stories: [S-INV-4]
milestone: M7
gui_under: inventory   # the screen is in Inventory > Agents (web/features/inventory)
