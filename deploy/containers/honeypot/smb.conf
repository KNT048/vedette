# The honeypot's Samba (WP-08e, D-162): a read-only guest share of planted file tokens whose every open is audited. Samba runs as the
# unprivileged user of the container (init.py), from a read-only root: every path Samba writes is under /tmp (a tmpfs), nothing is
# published on NetBIOS, there is no printer, no user database and no write access to the share.
[global]
	server role = standalone server
	workgroup = WORKGROUP
	netbios name = FILESERVER
	server string = File Server
	disable netbios = yes
	smb ports = 445
	server min protocol = SMB2_02

	# every client is a guest; there is no account to guess and nothing to authenticate against
	map to guest = Bad User
	guest account = hp
	restrict anonymous = 0
	passdb backend = tdbsam:/tmp/samba/private/passdb.tdb

	load printers = no
	disable spoolss = yes
	printcap name = /dev/null
	dns proxy = no
	usershare max shares = 0
	follow symlinks = no
	wide links = no

	log level = 1
	max log size = 0
	lock directory = /tmp/samba/lock
	state directory = /tmp/samba/state
	cache directory = /tmp/samba/cache
	pid directory = /tmp/samba/pid
	private dir = /tmp/samba/private
	ncalrpc dir = /tmp/samba/ncalrpc

	# The audit goes to syslog (/dev/log, read by init.py, which writes the line OpenCanary's smb module parses). The prefix holds only
	# values the server decides: init.py refuses any line that does not have exactly these six fields and then op|status|path.
	vfs objects = full_audit
	full_audit:prefix = %I|%i|%L|%R|%a|%S
	full_audit:success = connect openat
	full_audit:failure = none
	full_audit:facility = local7
	full_audit:priority = notice

[Shared]
	path = /tmp/share
	guest ok = yes
	read only = yes
	browseable = yes
