# containers.conf module of every Vedette unit (ContainersConfModule= in host/ops/quadlet.go, D-458).
# It names the AppArmor profile /etc/apparmor.d/vedette-container (same package) instead of Podman's containers-default:
# that one lets no process of a container signal another once crun stacks it (NoNewPrivileges), see the profile's header.
# Podman uses this name only where AppArmor is enabled; elsewhere it is ignored, like its own default.
[containers]
apparmor_profile = "vedette-container"
