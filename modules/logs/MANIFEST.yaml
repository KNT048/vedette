id: logs               # same as the folder name
name: { en: "Logs and anomalies" }
summary: { en: "Receives syslog and SPAN metadata, aggregates against a 7-day baseline, matches IOCs, forwards to a SIEM." }
tier: optional
default: off
depends: [core, feeds, inventory]
soft_depends: [notify, ai, response, sensor-passive]   # sensor-passive: the same sensor container, the source of SPAN metadata
permissions: ["outbound:siem"]   # no capability needed: the listener binds unprivileged ports 5514/5515; the SIEM address is declared by the customer
ports: ["udp/514", "tcp/514", "tcp/6514"]       # the box's ports (publish 514->5514 udp+tcp, 6514->5515 tcp); 6514 = syslog TLS (the GUI's defaultPort), only when the box has an HTTPS certificate
container: core        # the syslog listener runs in `core` (publish 514->5514, 6514->5515, no capability); moving to `sensor` is postponed until after v1
tables_prefix: logs_
tables: [logs_sources, logs_retention, logs_siem, logs_events, logs_source_buckets, logs_source_seen, logs_signature_daily, logs_signature_buckets, logs_signature_addrs, logs_anomaly_sent, logs_ioc_hits]   # config in the main database; logs_events, logs_source_*, logs_signature_*, logs_anomaly_sent, logs_ioc_hits in logs.db (INV-12)
stories: [S-LOG-1, S-LOG-2, S-LOG-3, S-LOG-4]
milestone: M5
