id: sensor-active
name: { en: "Active discovery" }
summary: { en: "Identifies devices and their services with nmap and SNMP, only inside the confirmed LAN scope, the time window and the speed limit you set." }
tier: standard
default: true
depends: [core, inventory]
permissions: [net_raw, "exec:nmap"]   # nmap comes from the OS package repository and is installed into the `scan` image that vedette-host builds on the box, not shipped; -O needs a raw socket
ports: []
container: scan                       # the nmap worker inside `scan` (the active mTLS role); policy, scope and sa_* live in `core`; for now nmap also runs from core through core/exec
tables_prefix: sa_                    # sa_; MODULES.md has been corrected
stories: [S-INV-1, S-SCAN-4]          # S-SCAN-4: the time-window/speed part of discovery
milestone: M3
