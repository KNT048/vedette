id: mcp-server         # same as the folder name
name: { en: "MCP server (read-only)" }
summary: { en: "A read-only MCP endpoint for external agents and SIEMs to query assets, findings and feeds with scoped tokens." }
tier: optional
default: off
depends: [core]
soft_depends: [inventory, findings, feeds]    # the tools of the `assets`/`findings`/`feeds` scopes report "module off" when the source module is off
permissions: []
ports: ["tcp/8765"]                 # loopback only (-mcp-listen, default 127.0.0.1:8765, endpoint /mcp)
container: core
tables_prefix: mcp_
tables: [mcp_tokens]
stories: [S-MCP-1]
milestone: M6
