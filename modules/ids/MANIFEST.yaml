id: ids                # same as the folder name
name: { en: "Intrusion detection" }
summary: { en: "Reads the IPS and IDS events in the logs your firewalls send to the box and links the CVEs they name to the attacked device's vulnerabilities." }
tier: optional
default: off
depends: [core, inventory, logs]
soft_depends: [notify, findings]   # notify: incident kind intrusion; findings: the attacked device's findings for the CVEs
permissions: []        # no port, no process, no outgoing connection: it only reads log lines the logs module has stored
ports: []
container: core
tables_prefix: ids_
tables: [ids_alert, ids_alert_cve]
stories: [S-IDS-1]
milestone: M5
