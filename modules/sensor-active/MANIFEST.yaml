id: sensor-active
name: { en: "Active discovery" }
summary: { en: "Identifies devices and their services with nmap and SNMP, only inside the confirmed LAN scope, the time window and the speed limit you set." }
tier: standard
default: true
depends: [core, inventory]
permissions: [net_raw, "exec:nmap"]   # nmap từ kho gói OS, cài vào image `scan` do vedette-host dựng trên hộp, không ship; -O cần raw socket
ports: []
container: scan                       # Worker nmap trong `scan` (vai mTLS active); chính sách, phạm vi, sa_* ở `core`; tới SP-3 nmap còn chạy qua core/exec từ core
tables_prefix: sa_                    # sa_; MODULES.md đã sửa
stories: [S-INV-1, S-SCAN-4]          # S-SCAN-4 phần cửa sổ giờ/tốc độ của khám phá
milestone: M3
