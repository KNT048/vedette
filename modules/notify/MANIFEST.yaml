id: notify
name: { en: "Alert channels" }
summary: { en: "Sends alerts, vulnerability notices and approval requests to Telegram, Slack, Zalo, email and webhooks; keeps the Incidents list and the send history." }
tier: standard
default: true
depends: [core]
permissions: [outbound:https, outbound:smtp]   # Telegram/Slack/Zalo/webhook over HTTPS; email over the customer's SMTP
ports: []        # Slack Socket Mode and Telegram long polling only open OUTGOING connections
container: core
tables_prefix: notify_
stories: [S-NOT-1, S-NOT-2, S-ALERT-1, S-ALERT-3, S-RESP-2]   # MODULES.md lists S-ALERT-1..2 (S-ALERT-2 was dropped)
milestone: M2
