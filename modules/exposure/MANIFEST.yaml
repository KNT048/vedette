id: exposure
name: { en: "External exposure" }
summary: { en: "Proves you own a domain or the box's public IP, then lists subdomains, IPs, open ports, exposed admin pages and expiring certificates, with a snapshot per day." }
tier: optional
default: false
depends: [core, inventory]
permissions: [outbound:https]   # tìm subdomain (CT, crt.sh), lượt quét của `scan`, ba dịch vụ "IP của tôi" công khai (AWS, Cloudflare, Google Cloud) để hộp tự thấy IP công cộng, và Shodan InternetDB khi admin bấm; Greenbone tuỳ chọn là container riêng, nói chuyện qua socket gvmd; không có máy chủ nào của dự án
ports: []
container: [core]               # API và dữ liệu ở `core`; máy quét bề mặt ngoài của `scan` (Go thuần, kết nối TCP) cũng chạy trong `core`
tables_prefix: exp_
stories: [S-EXP-1, S-EXP-2]
milestone: M4
