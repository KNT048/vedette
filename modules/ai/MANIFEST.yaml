id: ai                 # same as the folder name
name: { en: "AI assistant (BYOK)" }
summary: { en: "Customer AI profiles, job assignments with fallback, harness (rules, memory, skills, RAG, connections, hooks) and a tamper-evident AI log; the AI has no write tool." }
tier: optional
default: off
depends: [core]
soft_depends: [feeds, inventory, logs, scan, notify, honeypot]   # the AI reads whichever module has data; a missing one is reported as missing by the skill
permissions: ["outbound:https"]        # to the provider the customer configures; fetching advisories/PoC/RSS for "CVE news" is done by the box, not by the AI
ports: []
container: core
tables_prefix: ai_
tables: [ai_profile, ai_assignment, ai_setting, ai_result, ai_downgrade, ai_rule, ai_memory, ai_memory_suggestion, ai_skill_state, ai_knowledge_doc, ai_knowledge_chunk, ai_knowledge_chunk_fts, ai_hook, ai_hook_state, ai_activity, ai_read]   # external connections: core_connection*, not tables of ai
stories: [S-AI-1, S-AI-2, S-AI-3, S-AI-4, S-AI-5, S-AI-6, S-AI-7, S-AI-8]
milestone: M6
