id: auth-oidc          # trùng tên thư mục
name: { vi: "Đăng nhập SSO (OIDC)", en: "SSO sign-in (OIDC)" }
summary: { vi: "Đăng nhập một lần qua OIDC (authorization code + PKCE), ánh xạ nhóm IdP sang 3 vai xem/vận hành/quản trị.", en: "Single sign-on through OIDC (authorization code + PKCE), mapping IdP groups to the three roles viewer/operator/admin." }
tier: optional
default: off
depends: [core]
permissions: ["outbound:https"]     # discovery, token, JWKS tới IdP của khách khai báo
ports: []                           # redirect/callback trên cổng 8443 của core
container: core        # D-55
tables_prefix: oidc_
tables: [oidc_config]
stories: [S-CORE-3]
milestone: M7
