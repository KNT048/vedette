id: auth-oidc          # same as the folder name
name: { en: "SSO sign-in (OIDC)" }
summary: { en: "Single sign-on through OIDC (authorization code + PKCE), mapping IdP groups to the three roles viewer/operator/admin." }
tier: optional
default: off
depends: [core]
permissions: ["outbound:https"]     # discovery, token and JWKS requests to the IdP the customer declares
ports: []                           # /auth/oidc/* and the /sso/callback page on core's port 8443
container: core
tables_prefix: oidc_
tables: [oidc_config, oidc_flow]
stories: [S-CORE-3]
milestone: M7
