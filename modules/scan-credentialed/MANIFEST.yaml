id: scan-credentialed
name: { en: "Credentialed scans" }
summary: { en: "Scans important servers with an SSH account through a separate Greenbone container, for the packages and versions a network scan cannot see." }
tier: optional
needs_host: true      # runs only where vedette-host is (the appliance); a container-only install cannot turn it on
default: false
depends: [core, inventory, scan]
permissions: ["container:greenbone", outbound:https]   # the container goes through vedette-host (Podman/Quadlet); outbound:https = pulls the Greenbone NVT feed
ports: []
container: greenbone                                    # a separate container, unmodified, GPL/AGPL licence
tables_prefix: scc_
stories: [S-SCAN-5]
milestone: M7
